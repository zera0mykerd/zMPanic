<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

    <defs>

        <linearGradient id="shieldGrad"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%" stop-color="#FF5A5F"/>
            <stop offset="45%" stop-color="#E63946"/>
            <stop offset="100%" stop-color="#6E0014"/>
        </linearGradient>

        <radialGradient id="lensGrad"
                        cx="50%"
                        cy="40%"
                        r="60%">
            <stop offset="0%" stop-color="#FFD7D7"/>
            <stop offset="25%" stop-color="#FF8B8B"/>
            <stop offset="65%" stop-color="#D90429"/>
            <stop offset="100%" stop-color="#4A000C"/>
        </radialGradient>

        <linearGradient id="glass"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>

        <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="10" stdDeviation="14"
                          flood-color="#2A0000"
                          flood-opacity="0.35"/>
            </filter>

        </defs>

        <!-- Shield -->
        <path
            filter="url(#shadow)"
            fill="url(#shieldGrad)"
            d="
            M256 36
            L408 92
            V236
            C408 355 336 438 256 476
            C176 438 104 355 104 236
            V92
            Z"/>

        <!-- Glass reflection -->
        <path
            fill="url(#glass)"
            d="
            M145 110
            C220 70 310 70 367 120
            C315 112 255 118 190 145
            C170 153 154 138 145 110
            Z"/>

        <!-- Camera body -->
        <rect
            x="148"
            y="165"
            width="216"
            height="145"
            rx="38"
            fill="#7A0018"/>

        <!-- Camera top -->
        <rect
            x="205"
            y="138"
            width="80"
            height="34"
            rx="12"
            fill="#A50021"/>

        <!-- Lens outer -->
        <circle
            cx="256"
            cy="237"
            r="58"
            fill="#5A0011"/>

        <!-- Lens -->
        <circle
            cx="256"
            cy="237"
            r="46"
            fill="url(#lensGrad)"/>

        <!-- Lens core -->
        <circle
            cx="256"
            cy="237"
            r="18"
            fill="#FFE4E4"/>

        <!-- Crosshair marks -->
        <g stroke="#FFB4B4"
           stroke-width="8"
           stroke-linecap="round">

            <line x1="256" y1="148" x2="256" y2="166"/>
            <line x1="256" y1="308" x2="256" y2="326"/>

            <line x1="167" y1="237" x2="185" y2="237"/>
            <line x1="327" y1="237" x2="345" y2="237"/>

        </g>

        <!-- Microphone minimalist -->
        <g transform="translate(0,18)">

            <rect
                x="228"
                y="330"
                width="56"
                height="72"
                rx="28"
                fill="#FF6B6B"/>

            <line
                x1="256"
                y1="402"
                x2="256"
                y2="432"
                stroke="#FFD1D1"
                stroke-width="8"
                stroke-linecap="round"/>

            <path
                d="M224 432 Q256 450 288 432"
                fill="none"
                stroke="#FFD1D1"
                stroke-width="8"
                stroke-linecap="round"/>

            </g>

        </svg>
